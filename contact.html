<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("ZXTJy-gbjbfBtlTgT");
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Poppins, Arial, sans-serif;
            background: #04051f;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(80, 120, 255, .2), transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(138, 43, 226, .2), transparent 20%);
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: auto;
            padding: 80px 30px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h3 {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, .1);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            outline: none;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            background: linear-gradient(90deg, #5b8cff, #8b5cf6);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .info {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.8;
        }

        a {
            color: #8b5cf6;
            text-decoration: none;
        }

        /* ⭐ BACK BUTTON STYLE */
        .back-btn {
            margin-top: 25px;
            text-align: center;
        }

        .back-btn a {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }

        .back-btn a:hover {
            background: linear-gradient(90deg, #5b8cff, #8b5cf6);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div class="particles"></div>

    <section class="page">

        <h1>Contact</h1>
        <h3>Get in touch with me</h3>

        <div class="card">

            <form id="contactForm">

                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div class="info">
                📧 Email: ayshanorahhussain@gmail.com <br>
                💻 GitHub: <a href="https://github.com/ayshamk243" target="_blank">github.com/ayshamk243</a> <br>
                🔗 LinkedIn: <a href="https://www.linkedin.com/in/aysha-mk-b339282b7" target="_blank">View Profile</a>
            </div>

        </div>

        <!-- ⭐ BACK BUTTON ADDED -->
        <div class="back-btn">
            <a href="index.html">⬅ Back to Home</a>
        </div>

    </section>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();

            emailjs.send("service_42viop8", "template_ggx5kvo", {
                from_name: document.getElementById("name").value,
                from_email: document.getElementById("email").value,
                message: document.getElementById("message").value
            })
                .then(function () {
                    alert("✅ Message sent successfully to Gmail!");
                    document.getElementById("contactForm").reset();
                }, function (error) {
                    alert("❌ Failed to send message");
                    console.log(error);
                });
        });
    </script>

</body>

</html>
